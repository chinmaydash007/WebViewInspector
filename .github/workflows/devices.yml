name: Android compatibility
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  instrumentation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
      - name: Apply the current keyboard test harness to unchanged tagged runtime
        env:
          HARNESS_REF: ${{ github.sha }}
        run: |
          git diff --exit-code HEAD "$HARNESS_REF" -- gradle.properties gradle/libs.versions.toml build.gradle.kts settings.gradle.kts gradle/wrapper webview-inspector/build.gradle.kts webview-inspector-no-op/build.gradle.kts webview-inspector/src/main webview-inspector-no-op/src/main
          git show "${HARNESS_REF}:webview-inspector/src/androidTest/java/com/visit/webviewinspector/WebViewInspectorTest.kt" > webview-inspector/src/androidTest/java/com/visit/webviewinspector/WebViewInspectorTest.kt
      - name: Free space for emulator userdata on the disposable hosted runner
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon :webview-inspector:assembleDebugAndroidTest
      - run: |
          sudo chmod 666 /dev/kvm
      - name: Prepare the emulator test entry point
        run: |
          cat > "$RUNNER_TEMP/wvi-device-checks.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          test_api="$1"
          evidence=build/reports/devices
          mkdir -p "$evidence"
          adb -s emulator-5554 shell settings get secure show_ime_with_hard_keyboard > "$evidence/original-ci-keyboard-setting.txt"
          adb -s emulator-5554 shell ime list -s > "$evidence/available-ci-keyboards.txt"
          adb -s emulator-5554 shell settings put secure show_ime_with_hard_keyboard 1
          adb -s emulator-5554 logcat -v threadtime ImeTracker:V InputMethodManagerService:V InputMethodManager:V '*:S' > "$evidence/ime-logcat.txt" 2>&1 &
          task_ime_logcat_pid=$!
          trap 'kill "$task_ime_logcat_pid" 2>/dev/null || true' EXIT
          if [ "$test_api" = 36 ]; then
            python3 scripts/install_ci_webview.py --serial emulator-5554
            adb -s emulator-5554 install --no-incremental -r webview-inspector/build/outputs/apk/androidTest/debug/webview-inspector-debug-androidTest.apk
            adb -s emulator-5554 shell am instrument -w -r -e class 'com.visit.webviewinspector.WebViewInspectorTest#keyboardInsetsAccessibilityAndActualRotation' com.visit.webviewinspector.test/androidx.test.runner.AndroidJUnitRunner > "$evidence/keyboard-preflight.log"
            adb -s emulator-5554 pull /sdcard/Android/data/com.visit.webviewinspector.test/files/. "$evidence/keyboard-preflight-screenshots" >/dev/null 2>&1 || true
            if ! grep -q 'OK (1 test)' "$evidence/keyboard-preflight.log" || grep -Eq 'INSTRUMENTATION_STATUS_CODE: -[1234]|FAILURES!!!|INSTRUMENTATION_FAILED' "$evidence/keyboard-preflight.log"; then
              adb -s emulator-5554 shell dumpsys input_method > "$evidence/input-method-failure.txt"
              exit 1
            fi
          fi
          if ! python3 scripts/device_tests.py --serial emulator-5554 --api "$test_api"; then
            adb -s emulator-5554 shell dumpsys input_method > "$evidence/input-method-failure.txt"
            exit 1
          fi
          SCRIPT
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash "$RUNNER_TEMP/wvi-device-checks.sh" ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-evidence-api-${{ matrix.api }}
          path: build/reports/devices/
          retention-days: 14
