name: Android compatibility
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  instrumentation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Free space for emulator userdata on the disposable hosted runner
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon :webview-inspector:assembleDebugAndroidTest
      - run: |
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 scripts/device_tests.py --serial emulator-5554 --api ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-evidence-api-${{ matrix.api }}
          path: build/reports/devices/
          retention-days: 14
