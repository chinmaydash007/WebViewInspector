[versions]
agp = "8.12.0"
kotlin = "2.2.0"
publishing = "0.35.0"
dokka = "2.2.0"
compose = "2026.03.01"

[libraries]
core = { module = "androidx.core:core-ktx", version = "1.13.1" }
material = { module = "com.google.android.material:material", version = "1.12.0" }
webkit = { module = "androidx.webkit:webkit", version = { strictly = "1.15.0" } }
junit = { module = "junit:junit", version = "4.13.2" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.12.4" }
appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.0" }
recycler = { module = "androidx.recyclerview:recyclerview", version = "1.3.2" }
test-core = { module = "androidx.test:core", version = "1.7.0" }
test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
espresso = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }
runner = { module = "androidx.test:runner", version = "1.7.0" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
publishing = { id = "com.vanniktech.maven.publish.base", version.ref = "publishing" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
